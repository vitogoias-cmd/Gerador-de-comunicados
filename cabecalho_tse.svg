  <g transform="translate(525, 20)">
    <!-- 'T' -->
    <path d="M0,6 C0,2.5 2.5,0 6,0 L32,0 C35.5,0 38,2.5 38,6 L38,9 C38,10.5 36.8,11.7 35.3,11.7 L23,11.7 L23,32 C23,33.5 21.8,34.7 20.3,34.7 L17.7,34.7 C16.2,34.7 15,33.5 15,32 L15,11.7 L2.7,11.7 C1.2,11.7 0,10.5 0,9 Z" fill="#ffffff" />
    
    <!-- 'S' -->
    <path d="M44,8 C44,3 48,0 54,0 L74,0 C80,0 84,3.5 84,9 L84,12 C84,13.5 82.8,14.7 81.3,14.7 L57,14.7 C55,14.7 54,15.5 54,17 C54,18.5 55,19.3 57,19.3 L74,19.3 C80.5,19.3 84.5,23 84.5,28.5 L84.5,31 C84.5,36.5 80.5,40 74,40 L53,40 C47,40 43,36.5 43,31 L43,28 C43,26.5 44.2,25.3 45.7,25.3 L70,25.3 C72,25.3 73,24.5 73,23 C73,21.5 72,20.7 70,20.7 L54,20.7 C47.5,20.7 44,17 44,11.5 Z" fill="#ffffff" transform="translate(0, -2.5) scale(0.88)" />
    
