<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95" width="700" height="95">
  <defs>
    <linearGradient id="tseBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022a22" />
      <stop offset="30%" stop-color="#04392f" />
      <stop offset="65%" stop-color="#06483d" />
      <stop offset="100%" stop-color="#01241d" />
    </linearGradient>
    <linearGradient id="tseCurveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#001813" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#095447" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#001a14" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="tseCurveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#042f27" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="700" height="95" fill="url(#tseBgGrad)" />

  <!-- Organic Wave Lines / Contours -->
  <path d="M-20,95 Q140,25 320,65 T720,20 L720,95 Z" fill="url(#tseCurveGrad1)" />
  <path d="M-10,35 Q180,95 380,35 T720,80" fill="none" stroke="url(#tseCurveGrad2)" stroke-width="1.8" />
  <path d="M-10,60 Q210,110 440,50 T720,90" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.2" />
  <path d="M60,-10 Q280,75 520,15 T720,40" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="2" />

  <!-- Left Slogan: "Pensada por pessoas, projetada para o planeta." -->
  <text x="42" y="44" fill="#ffffff" font-family="'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.2">Pensada por pessoas,</text>
  <text x="42" y="69" fill="#ffffff" font-family="'Familjen Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.2">projetada para o planeta.</text>

